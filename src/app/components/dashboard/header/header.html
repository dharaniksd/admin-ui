<header class="header">
  <div class="header-left">
    <h2>Dashboard</h2>
  </div>
  
  <div class="header-right">
    @if (currentUser) {
      <div class="user-info">
        <span class="user-name">{{ currentUser.name }}</span>
        <span class="user-role">({{ currentUser.role }})</span>
      </div>
    }
    <button class="logout-btn" (click)="logout()">
      Logout
    </button>
  </div>
</header>
